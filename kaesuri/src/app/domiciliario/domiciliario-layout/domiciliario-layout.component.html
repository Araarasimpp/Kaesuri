<div class="layout">
  <app-notificaciones modo="flotante" [junto]="true"></app-notificaciones>
  <button class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="theme.isDark() ? 'Modo claro' : 'Modo oscuro'">
    <ion-icon [name]="theme.isDark() ? 'sunny-outline' : 'moon-outline'"></ion-icon>
  </button>

  <main class="content">
    <router-outlet></router-outlet>
  </main>

  <nav class="pill-nav">
    <a routerLink="/domiciliario" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" aria-label="Inicio">
      <ion-icon name="home-outline"></ion-icon>
      <span class="dot"></span>
    </a>
    <a routerLink="/domiciliario/cuadres" routerLinkActive="active" aria-label="Cuadres">
      <ion-icon name="wallet-outline"></ion-icon>
      <span class="dot"></span>
    </a>
    <button class="pill-action" (click)="logout()" aria-label="Cerrar sesión">
      <ion-icon name="log-out-outline"></ion-icon>
    </button>
  </nav>
</div>
