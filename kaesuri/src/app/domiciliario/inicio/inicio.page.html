<div class="domiciliario-page">
  <header class="page-header">
    <h1>Mis entregas</h1>
    <div class="header-actions">
      <a routerLink="/domiciliario/cuadres" class="link-cuadres">Cuadres</a>
      <button class="logout-btn" (click)="logout()">Salir</button>
    </div>
  </header>

  <ng-container *ngIf="!loading; else cargando">
    <div class="lista" *ngIf="pedidos.length; else vacio">
      <div class="pedido-card" *ngFor="let p of pedidos">
        <div class="pedido-top">
          <span class="numero">#{{ p.numero }}</span>
          <span class="total">{{ formatoMoneda(p.total) }}</span>
        </div>
        <p class="cliente">{{ p.cliente_nombre }}</p>
        <p class="direccion">{{ p.direccion }}<span *ngIf="p.barrio"> · {{ p.barrio }}</span></p>
        <p class="telefono" *ngIf="p.cliente_telefono">
          <a [href]="'tel:' + p.cliente_telefono">{{ p.cliente_telefono }}</a>
        </p>
        <p class="observaciones" *ngIf="p.observaciones">{{ p.observaciones }}</p>

        <button class="btn-entregar" (click)="abrirEntrega(p)">Marcar entregado</button>
      </div>
    </div>

    <ng-template #vacio>
      <p class="empty-msg">No tienes pedidos en ruta por ahora.</p>
    </ng-template>
  </ng-container>

  <ng-template #cargando>
    <p class="empty-msg">Cargando tus pedidos...</p>
  </ng-template>
</div>

<app-entregar-pedido
  *ngIf="pedidoEntregando"
  [pedido]="pedidoEntregando"
  (cerrar)="cerrarEntrega()"
  (entregado)="onEntregado()"
></app-entregar-pedido>
