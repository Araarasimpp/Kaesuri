<div class="layout">
  <header class="topbar">
    <span class="brand">Kaesuri</span>
    <button class="logout-btn" (click)="logout()">
      <ion-icon name="log-out-outline"></ion-icon>
    </button>
  </header>

  <main class="content">
    <router-outlet></router-outlet>
  </main>

  <nav class="bottom-nav">
    <a routerLink="/vendedor" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <ion-icon name="home-outline"></ion-icon>
      <span>Inicio</span>
    </a>
    <a routerLink="/vendedor/nuevo-pedido" routerLinkActive="active">
      <ion-icon name="add-circle-outline"></ion-icon>
      <span>Nuevo pedido</span>
    </a>
  </nav>
</div>
