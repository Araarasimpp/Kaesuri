<div class="auth-shell">
  <div class="auth-wrap">
    <div class="auth-brand">
      <img class="auth-logo" src="assets/icon/logo.png" alt="Variedades JYB" />
      <h1>Inicia sesión en Variedades JYB</h1>
      <p>Inventario, pedidos y entregas en un solo lugar</p>
    </div>

    <form class="auth-card" (ngSubmit)="onLogin()">
      <div class="field">
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" autocomplete="email" [(ngModel)]="email" placeholder="nombre@correo.com" />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" [(ngModel)]="password" placeholder="••••••••" />
      </div>

      <p class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</p>

      <button class="submit-btn" type="submit" [disabled]="loading">
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p class="switch-link">¿No tienes cuenta? <a routerLink="/auth/registro">Regístrate</a></p>
  </div>
</div>
