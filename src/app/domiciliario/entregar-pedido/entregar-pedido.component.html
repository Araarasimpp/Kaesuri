<div class="modal-backdrop" (click)="onCerrar()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <header class="modal-header">
      <h2>Entregar pedido #{{ pedido.numero }}<ng-container *ngIf="negocio"> · {{ negocio }}</ng-container></h2>
      <button class="close-btn" (click)="onCerrar()">✕</button>
    </header>

    <div class="modal-body">
      <p class="resumen">
        <span>{{ pedido.cliente_nombre }}</span>
        <span class="monto">{{ pedido.total | number }}</span>
      </p>

      <label class="metodo-opcion" [class.selected]="metodoPago === 'efectivo'">
        <input type="radio" name="metodo" value="efectivo" [(ngModel)]="metodoPago" />
        <span>Efectivo</span>
      </label>

      <label class="metodo-opcion" [class.selected]="metodoPago === 'transferencia'">
        <input type="radio" name="metodo" value="transferencia" [(ngModel)]="metodoPago" />
        <span>Transferencia</span>
      </label>

      <label class="metodo-opcion" [class.selected]="metodoPago === 'mixto'">
        <input type="radio" name="metodo" value="mixto" [(ngModel)]="metodoPago" />
        <span>Mixto (efectivo + transferencia)</span>
      </label>

      <div class="mixto-montos" *ngIf="metodoPago === 'mixto'">
        <label class="mixto-campo">
          <span>Recibido en efectivo</span>
          <input
            type="number"
            inputmode="numeric"
            min="0"
            [max]="pedido.total"
            placeholder="0"
            [(ngModel)]="montoEfectivo"
          />
        </label>
        <div class="mixto-campo">
          <span>Por transferencia</span>
          <strong class="monto">{{ montoTransferencia | number }}</strong>
        </div>
      </div>

      <!-- Varias fotos (cámara o galería), como en Jasta: se suben de una vez -->
      <div class="jt comprobantes" *ngIf="llevaComprobante">
        <app-comprobantes-input [rutas]="comprobantes" (cambio)="cambiarComprobantes($event)"></app-comprobantes-input>
      </div>

      <p class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</p>
    </div>

    <footer class="modal-footer">
      <button class="btn-secondary" (click)="onCerrar()">Cancelar</button>
      <button class="btn-primary" (click)="onConfirmar()" [disabled]="guardando || (llevaComprobante && !comprobantes.length)">
        {{ guardando ? 'Confirmando...' : 'Confirmar entrega' }}
      </button>
    </footer>
  </div>
</div>
