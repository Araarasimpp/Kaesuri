<div class="auth-shell">
  <div class="auth-wrap">
    <div class="auth-brand">
      <img class="auth-logo" src="assets/icon/logo.png" alt="Variedades JYB" />
      <h1>Crea tu cuenta</h1>
      <p>Empieza a vender con Variedades JYB en minutos</p>
    </div>

    <form class="auth-card" (ngSubmit)="onRegistrar()">
      <div class="field">
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" type="text" autocomplete="name" [(ngModel)]="nombre" placeholder="Tu nombre completo" />
      </div>

      <div class="field">
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" autocomplete="email" [(ngModel)]="email" placeholder="nombre@correo.com" />
      </div>

      <div class="field">
        <label for="telefono">Teléfono <span class="opcional">(opcional)</span></label>
        <input id="telefono" name="telefono" type="tel" autocomplete="tel" [(ngModel)]="telefono" placeholder="300 123 4567" />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="new-password" [(ngModel)]="password" placeholder="Mínimo 6 caracteres" />
      </div>

      <p class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</p>

      <button class="submit-btn" type="submit" [disabled]="loading">
        {{ loading ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>

      <p class="nota">Tu cuenta empieza como vendedor. El administrador puede cambiar tu rol.</p>
    </form>

    <p class="switch-link">¿Ya tienes cuenta? <a routerLink="/auth/login">Inicia sesión</a></p>
  </div>
</div>
