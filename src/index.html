<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>Variedades JYB</title>

  <base href="/" />

  <!-- Vinculo al archivo manifest -->
  <link rel="manifest" href="manifest.json" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="../assets/icon/logo.png" />

  <!-- Soporte PWA / Pantalla Completa para iOS y Android -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Variedades JYB" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" href="assets/icon/logo.png" />
</head>

<body>
  <!-- Aplica el tema guardado antes de pintar nada (mismo criterio que ThemeService) -->
  <script>
    try {
      var t = localStorage.getItem('kaesuri-theme');
      if (t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) document.body.classList.add('dark');
    } catch (e) {}
  </script>
  <app-root>
    <!-- Se ve mientras descarga la app; Angular lo reemplaza al arrancar -->
    <style>
      .arranque { box-sizing: border-box; min-height: 100vh; padding: 28px 16px; max-width: 640px; margin: 0 auto; }
      .arranque i { display: block; position: relative; overflow: hidden; background: var(--k-bg-alt, #f1f1f3); border-radius: 6px; }
      .arranque i::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65), transparent); animation: arranque 1.4s ease-in-out infinite; }
      body.dark .arranque i::after { background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent); }
      .arranque .t { width: 45%; height: 26px; margin-bottom: 22px; }
      .arranque div { background: var(--k-card-bg, #fff); border: 1px solid var(--k-border, #e6e6ea); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
      .arranque div i { height: 12px; margin-bottom: 10px; }
      .arranque div i:first-child { height: 18px; width: 60%; margin-bottom: 16px; }
      @keyframes arranque { to { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) { .arranque i::after { animation: none; } }
    </style>
    <div class="arranque" role="status" aria-label="Cargando">
      <i class="t"></i>
      <div><i></i><i style="width: 85%"></i><i style="width: 70%"></i><i style="width: 50%"></i></div>
      <div><i></i><i style="width: 75%"></i><i style="width: 80%"></i><i style="width: 40%"></i></div>
      <div><i></i><i style="width: 90%"></i><i style="width: 60%"></i><i style="width: 55%"></i></div>
    </div>
  </app-root>
</body>

</html>
